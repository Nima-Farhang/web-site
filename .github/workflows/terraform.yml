name: Terraform

on:
  push:
    branches: [master]
    paths:
      - 'terraform/**'
      - 'scripts/deploy_environment.sh'
      - 'scripts/lib/**'
      - 'scripts/validate_terraform.sh'
      - 'scripts/tests/**'
      - '.github/workflows/terraform.yml'
  workflow_dispatch:

permissions:
  contents: read

# Shared across both workflows so infrastructure and content releases cannot overlap.
concurrency:
  group: aws-website-release
  cancel-in-progress: false

env:
  TF_IN_AUTOMATION: 'true'

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: '1.9.6'
          terraform_wrapper: false
      - run: python3 -m unittest discover -s scripts/tests -v
      - run: ./scripts/validate_terraform.sh

  deploy-test:
    if: github.ref == 'refs/heads/master'
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 60
    environment: test
    env:
      APPLY_APPROVE: 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: '1.9.6'
          terraform_wrapper: false
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: ap-southeast-2
      - name: Verify AWS account
        run: test "$(aws sts get-caller-identity --query Account --output text)" = "210006516097"
      - name: Plan and apply test
        run: ./scripts/deploy_environment.sh test

  deploy-prod:
    if: github.ref == 'refs/heads/master'
    needs: deploy-test
    runs-on: ubuntu-latest
    timeout-minutes: 60
    environment: prod
    env:
      APPLY_APPROVE: 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: '1.9.6'
          terraform_wrapper: false
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: ap-southeast-2
      - name: Verify AWS account
        run: test "$(aws sts get-caller-identity --query Account --output text)" = "210006516097"
      - name: Plan and apply prod
        run: ./scripts/deploy_environment.sh prod
