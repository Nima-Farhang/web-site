name: Terraform

on:
  workflow_dispatch:
    inputs:
      environment:
        description: Environment to deploy
        required: true
        type: choice
        default: dev
        options:
          - dev
          - test
          - prod

permissions:
  contents: read

# Shared across both workflows to serialize releases targeting the same environment.
concurrency:
  group: aws-website-release-${{ inputs.environment }}
  cancel-in-progress: false

env:
  TF_IN_AUTOMATION: 'true'

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: '1.9.6'
          terraform_wrapper: false
      - run: python3 -m unittest discover -s scripts/tests -v
      - run: ./scripts/validate_terraform.sh

  deploy:
    name: Deploy ${{ inputs.environment }}
    if: github.ref == 'refs/heads/master'
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 60
    environment: ${{ inputs.environment }}
    env:
      APPLY_APPROVE: 'true'
      ENVIRONMENT: ${{ inputs.environment }}
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: '1.9.6'
          terraform_wrapper: false
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: ap-southeast-2
      - name: Verify AWS account
        run: test "$(aws sts get-caller-identity --query Account --output text)" = "210006516097"
      - name: Plan and apply selected environment
        run: ./scripts/deploy_environment.sh "${ENVIRONMENT}"
